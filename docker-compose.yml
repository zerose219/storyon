services:
  postgres:
    image: postgres:16
    container_name: storyon-postgres
    environment:
      POSTGRES_DB: storyon_db
      POSTGRES_USER: storyon_app
      POSTGRES_PASSWORD: storyon
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - storyon-network

  backend:
    build:
      context: ./backend
    container_name: storyon-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://storyon_app:storyon@postgres:5432/storyon_db
    depends_on:
      - postgres
    networks:
      - storyon-network

  redis:
    image: redis:7
    container_name: storyon-redis
    ports:
      - "6379:6379"
    networks:
      - storyon-network

volumes:
  postgres_data:

networks:
  storyon-network:
    driver: bridge